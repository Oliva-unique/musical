<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>맞춤 커리큘럼 안내문 · UNIQUE ENGLISH</title>
<style>
/* VOICE 차분한 학원 안내문 · IDEA 상담 후 건네는 A4 한 장 · PICTURE 학기별 비교표 · COLOUR 포레스트 그린 + 하이라이트 옐로 · TYPE SUIT */
@font-face{font-family:SUIT;src:url(fonts/SUIT-400.otf);font-weight:400}
@font-face{font-family:SUIT;src:url(fonts/SUIT-700.otf);font-weight:700}
@font-face{font-family:SUIT;src:url(fonts/SUIT-900.otf);font-weight:900}
@page{size:A4;margin:12mm 12mm 14mm}
:root{--g:#1F411E;--sage:#96AB95;--mist:#DCE8DC;--teal:#12806F;--hl:#FFD84D;--ink:#1d2a1c;--mut:#5d6b5c;--line:#dfe7de}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:SUIT,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:#e9eee8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tool{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px}
.tool button{font:900 15px SUIT,sans-serif;background:var(--hl);color:var(--g);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.tool span{opacity:.85}
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:12mm 12mm 14mm;box-shadow:0 4px 18px rgba(31,65,30,.12)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid var(--g);padding-bottom:5mm;margin-bottom:5mm}
.hd img{height:6mm}
.hd .meta{text-align:right;font-size:8.5pt;color:var(--mut);line-height:1.6}
h1{font-size:21pt;font-weight:900;color:var(--g);letter-spacing:-.02em;margin-top:4mm;line-height:1.2}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%)}
.lead{font-size:9.5pt;color:var(--mut);margin-top:2mm;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin:5mm 0}
.stats div{background:#F2F7F1;border-radius:2.5mm;padding:3mm 4mm}
.stats b{display:block;font-size:15pt;font-weight:900;color:var(--g)}
.stats span{font-size:8pt;color:var(--mut)}
.lt{border:1px solid var(--line);border-radius:2.5mm;padding:3mm 4mm;margin-bottom:5mm}
.lt h3,.sec h3{font-size:10pt;font-weight:900;color:var(--g);margin-bottom:2mm}
.lt ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 6mm;font-size:8.8pt}
.lt li b{display:inline-block;min-width:11mm;color:var(--teal)}
.lt li small{color:var(--mut)}
.key{display:flex;gap:4mm;flex-wrap:wrap;font-size:8pt;color:var(--mut);margin-bottom:3mm}
.key i{display:inline-block;font-style:normal;font-weight:900;font-size:7pt;border-radius:1mm;padding:.3mm 1.4mm;margin-right:1mm}
.t-new{background:var(--hl);color:var(--g)}.t-back{background:#F6D7CC;color:#9a3b1f}.t-out{background:#eceae4;color:#8a877e}
.blk{break-inside:avoid;page-break-inside:avoid;margin-bottom:4mm}
.blk h2{font-size:11pt;font-weight:900;color:#fff;background:var(--g);display:flex;justify-content:space-between;align-items:center;padding:1.8mm 3.5mm;border-radius:2mm 2mm 0 0}
.blk h2 small{font-size:8pt;font-weight:700;color:var(--mist)}
table{width:100%;border-collapse:collapse;font-size:8.6pt;table-layout:fixed}
th{background:#F2F7F1;color:var(--mut);font-weight:700;font-size:7.8pt;text-align:left;padding:1.5mm 3mm;border-bottom:1px solid var(--line)}
td{padding:2mm 3mm;border-bottom:1px solid var(--line);vertical-align:top}
td.a{width:24mm;font-weight:900;color:var(--g)}
tr.chg td.a::after{content:'조정';display:block;font-size:6.8pt;font-weight:700;color:#b58a00;margin-top:.5mm}
.bk{display:flex;align-items:center;gap:2mm;margin:.6mm 0;line-height:1.3}
.bk img,.bk .nc{width:7.5mm;height:10.5mm;object-fit:cover;border-radius:.8mm;flex:none;box-shadow:0 .3mm .8mm rgba(0,0,0,.15)}
.bk .nc{border:.3mm dashed var(--sage);background:#FBF7EC}
.bk i{font-style:normal;font-weight:900;font-size:6.6pt;border-radius:1mm;padding:.2mm 1.2mm;margin-left:1mm;white-space:nowrap}
.bk.out{color:#9b998f;text-decoration:line-through}
.bk.out img{opacity:.45;filter:grayscale(1)}
.none{color:#b0b8af;font-size:8pt}
.ft{margin-top:6mm;padding-top:3mm;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:8pt;color:var(--mut)}
.ft b{color:var(--g)}
.empty{max-width:520px;margin:60px auto;background:#fff;border-radius:16px;padding:28px;font-size:16px;line-height:1.6}
.empty h2{color:var(--g);margin-bottom:8px}
.empty button{margin-top:14px;font:900 15px SUIT,sans-serif;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 18px}
@media screen and (max-width:820px){.sheet{width:auto;margin:0;padding:6vw 5vw;box-shadow:none;min-height:0}}
@media print{body{background:#fff}.tool{display:none}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}}
</style>
<script src="data.js"></script>
</head><body>
<div class="tool"><span id="tip">인쇄 버튼을 누르면 A4로 인쇄하거나 PDF로 저장할 수 있어요.</span><button id="pr">인쇄 · PDF 저장</button></div>
<main id="out"></main>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BK=Object.fromEntries(B.map(b=>[b.id,b]));
const BCOLS=COLS.map(c=>c[0]);
const colLabel=v=>{const c=COLS.find(x=>x[0]===v);return c?(c[1]+(c[2]?' '+c[2]:'')):''};
function decode(h){try{const m=h.match(/d=([A-Za-z0-9_-]+)/);if(!m)return null;let s=m[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
 const bin=atob(s),u=new Uint8Array([...bin].map(c=>c.charCodeAt(0)));return JSON.parse(new TextDecoder().decode(u))}catch(e){return null}}
function defaultCells(cur){const mc=BCOLS.filter(v=>v>=cur-.01),cells={};AREAS.forEach(a=>{cells[a.k]={};mc.forEach(v=>cells[a.k][v]=[])});
 B.forEach(b=>{if(b.alt||b.mapOnly)return;const v=b.home!=null?(mc.includes(b.home)?b.home:null):b.cols.find(c=>mc.includes(c));if(v!=null)cells[b.a][v].push(b.id)});return cells}
const cov=id=>{const b=BK[id];const c=b.nocov?null:A.cov[id];return c?`<img src="${c}" alt="">`:'<span class="nc"></span>'};
function render(D){
 const cur=+D.c,mc=BCOLS.filter(v=>v>=cur-.01),def=defaultCells(cur),mine=D.cells||{};
 const behind=id=>{const b=BK[id];return b&&!b.slot&&b.cols.length>0&&b.lv<cur-.01};
 const get=(o,a,v)=>((o[a]||{})[v]||(o[a]||{})[String(v)]||[]).filter(id=>BK[id]&&!BK[id].slot);
 let blocks='',nChg=0,nBack=0;const chgAreas=new Set();
 mc.forEach(v=>{let rows='';
  AREAS.forEach(a=>{const d=get(def,a.k,v),m=get(mine,a.k,v);if(!d.length&&!m.length)return;
   const changed=d.join()!==m.join();if(changed){nChg++;chgAreas.add(a.n)}
   const dl=d.map(id=>`<div class="bk${m.includes(id)?'':' out'}">${cov(id)}<span>${esc(BK[id].t)}</span></div>`).join('')||'<span class="none">—</span>';
   const ml=m.map(id=>{const bk=!d.includes(id)&&behind(id);const tags=(d.includes(id)?'':'<i class="t-new">조정</i>')+(bk?'<i class="t-back">보강</i>':'');if(bk)nBack++;return `<div class="bk">${cov(id)}<span>${esc(BK[id].t)}${tags}</span></div>`}).join('')||'<span class="none">이 학기는 쉬어 갑니다</span>';
   rows+=`<tr class="${changed?'chg':''}"><td class="a">${esc(a.n)}</td><td>${dl}</td><td>${ml}</td></tr>`});
  if(!rows)return;
  const G=GOALS[goalKey(v)]||{};
  blocks+=`<div class="blk"><h2>${esc(colLabel(v))}<small>${G.min?'수업 '+esc(G.min):''}</small></h2><table><thead><tr><th style="width:24mm">영역</th><th>기존 학년 커리</th><th>맞춤 커리</th></tr></thead><tbody>${rows}</tbody></table></div>`});
 const nm=esc(D.n||'우리 아이'),d=new Date(),ds=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
 const lt=(D.lt||[]).length?`<div class="lt"><h3>레벨테스트 판정</h3><ul>${D.lt.map(r=>`<li><b>${esc(r[0])}</b>${esc(r[1])}${r[2]?` <small>· ${esc(r[2])}</small>`:''}</li>`).join('')}</ul></div>`:'';
 const lead=chgAreas.size?`${[...chgAreas].map(esc).join('·')} 영역을 학생에게 맞게 조정했습니다. 나머지 영역은 ${esc(glShort(cur))} 기존 과정을 그대로 따릅니다.`:`${esc(glShort(cur))} 기존 학년 커리를 그대로 따르는 계획입니다.`;
 $('#out').innerHTML=`<div class="sheet">
 <div class="hd"><div><img src="${A.logo}" alt="UNIQUE ENGLISH"><h1>${nm} 학생 <em>맞춤 커리큘럼</em> 안내</h1><p class="lead">${lead}</p></div><div class="meta">상담일 ${ds}<br>현재 ${esc(colLabel(mc[0]))}</div></div>
 <div class="stats"><div><b>${esc(colLabel(mc[0]))} ~ ${esc(colLabel(mc[mc.length-1]))}</b><span>안내 기간</span></div><div><b>${chgAreas.size}개 영역</b><span>기존 커리에서 조정</span></div><div><b>${nBack}권</b><span>기초 보강 교재</span></div></div>
 ${lt}
 <div class="key"><span>왼쪽은 학년별 기존 커리, 오른쪽은 이번 상담으로 정한 커리입니다.</span><span><i class="t-new">조정</i>기존과 다른 교재</span><span><i class="t-back">보강</i>아래 단계 교재로 기초 다지기</span><span><i class="t-out" style="text-decoration:line-through">취소선</i>맞춤 커리에서 빠진 교재</span></div>
 ${blocks}
 <div class="ft"><span><b>UNIQUE ENGLISH</b> · 생각하는 Test로 꾸준히 확인하며 과정을 조정합니다.</span><span>문의 051-791-0585 · 부산 동래구 사직로70번길 56</span></div></div>`;
 document.title=`${D.n||'학생'} 맞춤 커리큘럼 안내`}
function sample(){const cur=8,c=defaultCells(cur);c.gr[8]=['link2'];c.rd[8]=['rtj3','dd1'];return{n:'김유니(예시)',c:cur,cells:c,lt:[['단어','워드마스터 중등 실력'],['문법','Link 2','1권 핵심 복습 후 2권'],['구문','천일문 Starter 1부터'],['독해','리딩튜터 주니어 3']]}}
function go(){const D=decode(location.hash);
 if(D&&D.c!=null){render(D);return}
 $('#out').innerHTML=`<div class="empty"><h2>맞춤 커리큘럼 안내문</h2>커리큘럼 맵의 <b>맞춤 커리 만들기 → 학부모용 요약 보기 → A4 안내문 열기</b>로 들어오면 학생의 안내문이 여기에 만들어져요.<br><button id="smp">예시 안내문 보기</button></div>`;
 $('#smp').onclick=()=>render(sample())}
$('#pr').onclick=()=>window.print();
window.addEventListener('hashchange',go);go();
}
</script>
</body></html>
