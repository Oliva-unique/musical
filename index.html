<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Musical · Unique English</title>
<meta name="description" content="유니크 잉글리시 뮤지컬 핼러윈 영상">
<meta property="og:title" content="🎃 Halloween Musical">
<meta property="og:description" content="유니크 잉글리시 뮤지컬 영상 보기 · 고화질 다운로드">
<meta property="og:image" content="images/banner.jpg">
<link rel="icon" href="images/pumpkin.png">
<link rel="preload" href="fonts/CookieRun-Black.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"CookieRun";src:url("fonts/CookieRun-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"CookieRun";src:url("fonts/CookieRun-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"CookieRun";src:url("fonts/CookieRun-Black.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Dovemayo";src:url("fonts/Dovemayo_gothic.woff2") format("woff2");font-display:swap}

:root{
  --night:#2b2259;
  --night-2:#3a2f78;
  --sky:#5b4ba6;
  --pumpkin:#f28a2e;
  --pumpkin-dark:#d96f14;
  --purple:#9a7ad6;
  --lime:#a8d84e;
  --cream:#fff6e3;
  --ink:#2a2140;
  --muted:#c9bfee;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Dovemayo",-apple-system,"Apple SD Gothic Neo",sans-serif;
  color:var(--cream);
  background:var(--night);
  background-image:
    radial-gradient(circle at 15% 20%,rgba(255,246,227,.5) 0 1.2px,transparent 1.6px),
    radial-gradient(circle at 75% 60%,rgba(255,246,227,.35) 0 1px,transparent 1.4px),
    radial-gradient(circle at 40% 85%,rgba(255,246,227,.4) 0 1px,transparent 1.4px);
  background-size:180px 180px,230px 230px,150px 150px;
  min-height:100vh;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ---------- 배너 ---------- */
.hero{
  position:relative;
  aspect-ratio:1376/768;
  max-height:78vh;
  width:100%;
  background:url("images/banner.jpg") center bottom/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;
  padding:clamp(56px,11vw,120px) 20px 0;
}
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:70px;
  background:linear-gradient(to bottom,rgba(43,34,89,0),var(--night));
}
.logo-badge{
  position:absolute;top:14px;left:14px;width:56px;height:56px;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
  z-index:2;
}
.hero-kicker{
  font-family:"CookieRun";font-weight:700;
  font-size:clamp(14px,2.4vw,20px);
  letter-spacing:.06em;
  color:var(--ink);
  background:var(--cream);
  padding:6px 16px;border-radius:999px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
  position:relative;z-index:1;
}
.hero h1{
  font-family:"CookieRun";font-weight:900;
  font-size:clamp(40px,8.5vw,92px);
  line-height:1.02;
  margin-top:14px;
  color:var(--pumpkin);
  -webkit-text-stroke:0;
  text-shadow:
    0 3px 0 var(--pumpkin-dark),
    0 6px 0 #5a2a0a,
    0 10px 24px rgba(0,0,0,.35);
  position:relative;z-index:1;
}
.hero h1 span{display:block;color:var(--cream);text-shadow:0 3px 0 #c9b98f,0 6px 0 #4a3d6e,0 10px 24px rgba(0,0,0,.35)}
.hero p{
  margin-top:14px;font-size:clamp(14px,2.2vw,18px);
  color:var(--cream);opacity:.92;position:relative;z-index:1;
}

/* ---------- 본문 ---------- */
main{
  position:relative;
  max-width:820px;margin:0 auto;
  padding:8px 18px 40px;
}
.section-title{
  display:flex;align-items:center;gap:10px;
  font-family:"CookieRun";font-weight:700;
  font-size:clamp(20px,3.4vw,26px);
  margin:10px 4px 18px;
}
.section-title img{width:40px;height:40px}

.card{
  position:relative;
  background:linear-gradient(180deg,var(--night-2),#2f2668);
  border:2px solid rgba(255,246,227,.12);
  border-radius:28px;
  padding:16px;
  margin-bottom:26px;
  box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.25);
}
.card-head{display:flex;align-items:center;gap:12px;margin:2px 4px 14px}
.card-head .num{
  flex:none;width:58px;height:58px;
  display:grid;place-items:center;
}
.card-head .num img{width:58px;height:58px}
.card-head h2{
  font-family:"CookieRun";font-weight:700;
  font-size:clamp(19px,3.2vw,24px);line-height:1.2;
}
.card-head small{display:block;margin-top:3px;font-size:14px;color:var(--muted)}

.player{
  position:relative;aspect-ratio:16/9;width:100%;
  border-radius:20px;overflow:hidden;
  background:#1c1640;
}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{
  position:absolute;inset:0;width:100%;height:100%;
  border:0;cursor:pointer;
  background:url("images/banner.jpg") center/cover;
  display:grid;place-items:center;
  font:inherit;color:inherit;
}
.poster::before{content:"";position:absolute;inset:0;background:rgba(28,22,64,.45)}
.poster img{position:relative;width:clamp(72px,14vw,104px);transition:transform .2s ease}
.poster span{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-family:"CookieRun";font-weight:700;font-size:15px;
  background:rgba(28,22,64,.7);padding:6px 14px;border-radius:999px;white-space:nowrap;
}
.poster:hover img,.poster:focus-visible img{transform:scale(1.08)}
.poster:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}

.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);font-size:15px;text-align:center;padding:16px;
}
.empty img{width:86px;animation:float 3.2s ease-in-out infinite}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:8px 12px;border-radius:18px;
  font-family:"CookieRun";font-weight:700;font-size:16px;
  transition:transform .12s ease,box-shadow .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn img{width:30px;height:30px}
.btn-view{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 #cdbf9f}
.btn-dl{background:var(--pumpkin);color:#fff;box-shadow:0 5px 0 var(--pumpkin-dark)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}

.tip{
  display:flex;gap:12px;align-items:flex-start;
  background:rgba(255,246,227,.08);
  border:1.5px dashed rgba(255,246,227,.25);
  border-radius:20px;padding:14px 16px;font-size:14.5px;line-height:1.6;color:var(--muted);
}
.tip img{width:40px;flex:none}
.tip b{color:var(--cream);font-weight:normal;font-family:"CookieRun"}

.cast{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cast li{
  font-family:"CookieRun";font-weight:700;font-size:13.5px;
  background:rgba(255,246,227,.12);color:var(--cream);
  padding:4px 11px;border-radius:999px;transition:background .2s,color .2s,transform .2s;
}
.cast li.hit{background:var(--lime);color:var(--ink);transform:scale(1.08)}
.card.hit{border-color:var(--lime);box-shadow:0 0 0 4px rgba(168,216,78,.35),0 10px 0 rgba(0,0,0,.18)}

.finder{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:10px;
  background:var(--cream);border-radius:22px;padding:8px 14px 8px 10px;
  box-shadow:0 5px 0 #cdbf9f;margin:6px 0 4px;
}
.finder img{width:40px;height:40px;flex:none}
.finder input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:"Dovemayo",sans-serif;font-size:16px;color:var(--ink);padding:10px 0;
}
.finder input::placeholder{color:#9a8fb8}
.find-msg{min-height:1.4em;margin:8px 6px 0;font-size:14.5px;color:var(--lime);position:relative;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 장식 ---------- */
.deco{position:absolute;pointer-events:none;z-index:0}
.deco.spider{top:-6px;right:6%;width:54px;animation:dangle 4s ease-in-out infinite;transform-origin:top center}
.deco.bat{animation:float 3.6s ease-in-out infinite}
.deco.candy{animation:float 4.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes dangle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- 푸터 ---------- */
footer{
  max-width:820px;margin:0 auto;padding:10px 18px 48px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.footer-row{display:flex;gap:10px;opacity:.95}
.footer-row img{width:40px}
.footer-logo{
  background:var(--cream);border-radius:999px;padding:10px 22px;
  box-shadow:0 5px 0 #cdbf9f;
}
.footer-logo img{height:30px;width:auto}

@media (max-width:640px){
  .hero{aspect-ratio:auto;height:min(118vw,560px);background-image:url("images/banner-mobile.jpg")}
  .logo-badge{width:48px;height:48px}
  .card{padding:12px;border-radius:24px}
  .btn{font-size:15px;min-height:52px}
  .btn img{width:26px;height:26px}
}
</style>
</head>
<body>

<header class="hero">
  <img class="logo-badge" src="images/logo-round.png" alt="Unique English">
  <div class="hero-kicker">UNIQUE ENGLISH MUSICAL</div>
  <h1>Halloween<span>Musical</span></h1>
  <p>영상을 보고, 고화질로 내려받을 수 있어요</p>
</header>

<main>
  <img class="deco spider" src="images/spider.png" alt="">
  <div class="finder">
    <img src="images/witch-hat.png" alt="">
    <label for="find" class="sr">이름으로 찾기</label>
    <input id="find" type="search" placeholder="아이 영어 이름으로 찾기 (예: Ella)" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <p class="find-msg" id="findMsg" aria-live="polite"></p>
  <h2 class="section-title" aria-label="영상"><img src="images/clapper.png" alt=""></h2>
  <div id="videos"></div>

  <div class="tip">
    <img src="images/ghost.png" alt="">
    <div>
      <b>다운로드가 안 될 때</b><br>
      파일이 크면 "바이러스 검사를 할 수 없음" 화면이 한 번 떠요. <b>무시하고 다운로드</b>를 누르면 받아져요.<br>
      아이폰은 드라이브 앱이 열리면 <b>⋯ → 사본 보내기 → 동영상 저장</b>을 누르면 사진첩에 들어가요.
    </div>
  </div>
</main>

<footer>
  <div class="footer-row">
    <img src="images/pumpkin.png" alt=""><img src="images/candy.png" alt=""><img src="images/bat.png" alt=""><img src="images/candy-corn.png" alt=""><img src="images/cat.png" alt="">
  </div>
  <div class="footer-logo"><img src="images/logo-wide.png" alt="Unique English"></div>
</footer>

<script>
/* =========================================================
   영상 바꾸는 곳 — 여기만 고치면 돼요
   link : 구글 드라이브 공유 링크를 그대로 붙여 넣기
          (공유 설정: 링크가 있는 모든 사용자)
   비워 두면 "영상 준비 중"으로 보여요
   ========================================================= */
const VIDEOS = [
  { title: "초3A The Pumpkin Ghost on Halloween Night", icon: "pumpkin",
    cast: ["Bailey", "Brody", "Ella", "Lia", "Lucy", "Sion"],
    link: "https://drive.google.com/file/d/11wBrsODhDQf3PirkS9rPA4w4BXyrLL3c/view?usp=sharing" },
  { title: "초3B Haunted Halloween Party", icon: "ghost",
    cast: ["Christy", "Ethan", "Joy", "Olivia"],
    link: "https://drive.google.com/file/d/1AZcDqPg85vqzKihXkf-QEdT8xYWRFbcX/view?usp=drive_link" },
  { title: "초3C Haunted Halloween Party", icon: "cauldron",
    cast: ["Bella", "Chase", "Julie", "Victor"],
    link: "https://drive.google.com/file/d/1cUZ3_WfdvjXOwNuzkqLabZMCF9E3rGsq/view?usp=sharing" },
];
/* ========================================================= */

function driveId(link){
  if(!link) return "";
  const m = link.match(/\/d\/([\w-]{10,})/) || link.match(/[?&]id=([\w-]{10,})/);
  return m ? m[1] : (/^[\w-]{20,}$/.test(link.trim()) ? link.trim() : "");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const wrap = document.getElementById("videos");
VIDEOS.forEach((v,i)=>{
  const id = driveId(v.link);
  const card = document.createElement("article");
  card.className = "card";
  card.id = "video-"+(i+1);
  card.innerHTML = `
    <div class="card-head">
      <div class="num"><img src="images/${esc(v.icon||"pumpkin")}.png" alt=""></div>
      <div><h2>${esc(v.title)}</h2>${v.sub?`<small>${esc(v.sub)}</small>`:""}${(v.cast||[]).length?`<ul class="cast" aria-label="출연">${[...v.cast].sort((x,y)=>x.localeCompare(y)).map(n=>`<li data-name="${esc(n.toLowerCase())}">${esc(n)}</li>`).join("")}</ul>`:""}</div>
    </div>
    <div class="player">
      ${id
        ? `<button class="poster" type="button" aria-label="${esc(v.title)} 재생"><img src="images/play.png" alt=""><span>눌러서 재생</span></button>`
        : `<div class="empty"><img src="images/ghost.png" alt=""><div>영상 준비 중이에요</div></div>`}
    </div>
    <div class="actions">
      <a class="btn btn-view" ${id?`href="https://drive.google.com/file/d/${id}/view"`:'aria-disabled="true"'} target="_blank" rel="noopener">
        <img src="images/popcorn.png" alt="">고화질로 보기</a>
      <a class="btn btn-dl" ${id?`href="https://drive.usercontent.google.com/download?id=${id}&export=download"`:'aria-disabled="true"'} target="_blank" rel="noopener">
        <img src="images/download.png" alt="">고화질 다운로드</a>
    </div>`;
  if(id){
    card.querySelector(".poster").addEventListener("click",function(){
      const f = document.createElement("iframe");
      f.src = `https://drive.google.com/file/d/${id}/preview`;
      f.allow = "autoplay; fullscreen";
      f.allowFullscreen = true;
      f.title = v.title;
      this.replaceWith(f);
    });
  }
  wrap.appendChild(card);
});

const findInput = document.getElementById("find");
const findMsg = document.getElementById("findMsg");
let findTimer;
findInput.addEventListener("input", ()=>{
  clearTimeout(findTimer);
  findTimer = setTimeout(runFind, 250);
});
findInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); runFind(true); findInput.blur(); } });
function runFind(scroll){
  const q = findInput.value.trim().toLowerCase();
  document.querySelectorAll(".hit").forEach(el=>el.classList.remove("hit"));
  if(!q){ findMsg.textContent=""; return; }
  const hits = [...document.querySelectorAll(".cast li")].filter(li=>li.dataset.name.startsWith(q));
  if(!hits.length){ findMsg.textContent = "이름을 찾지 못했어요. 영어 철자를 확인해 주세요."; return; }
  hits.forEach(li=>{ li.classList.add("hit"); li.closest(".card").classList.add("hit"); });
  const first = hits[0].closest(".card");
  const cls = first.querySelector("h2").textContent.split(" ")[0];
  findMsg.textContent = hits.length===1 ? `${hits[0].textContent} → ${cls} 영상이에요 👇` : `${hits.length}명을 찾았어요 👇`;
  if(scroll || hits.length===1) first.scrollIntoView({behavior:"smooth", block:"start"});
}
</script>
</body>
</html>
